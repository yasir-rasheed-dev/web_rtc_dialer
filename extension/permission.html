<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ringNex — Microphone access</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#0b1017;color:#e9eff5;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .box{max-width:340px;text-align:center}
  img{height:34px;margin-bottom:14px}
  h1{font-size:16px;margin:0 0 8px}
  p{color:#8ea3b5;margin:0 0 18px;font-size:13px}
  button{background:linear-gradient(135deg,#0684BC,#0571a3);color:#fff;border:0;border-radius:8px;
    height:38px;padding:0 20px;font-weight:600;font-size:13px;cursor:pointer}
  .err{color:#ff9a9a;font-size:12px;margin-top:12px}
  .ok{color:#3ddc6a}
</style>
</head>
<body>
  <div class="box">
    <img src="icons/icon48.png" alt="" />
    <h1 id="t">Allow microphone access</h1>
    <p id="d">ringNex Dialer needs your microphone to place and take calls. Click below and choose <b>Allow</b>.</p>
    <button id="go">Allow microphone</button>
    <div id="msg" class="err" hidden></div>
  </div>
<script src="permission.js"></script>
</body>
</html>
