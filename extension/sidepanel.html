<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ringNex Dialer</title>
<link rel="stylesheet" href="sidepanel.css" />
</head>
<body>

<!-- ===== LOGIN ===== -->
<section id="view-login" class="view">
  <div class="brand"><img src="icons/icon48.png" alt="" /><b>ring<i>Nex</i> Dialer</b></div>
  <p class="muted sm">Sign in with your agent account.</p>
  <form id="login-form" class="stack">
    <label>Workspace<input id="li-workspace" autocomplete="off" placeholder="acme" required /></label>
    <label>Email<input id="li-email" type="email" autocomplete="username" required /></label>
    <label>Password<input id="li-password" type="password" autocomplete="current-password" required /></label>
    <div id="li-2fa" hidden>
      <div id="li-qr-wrap" hidden>
        <p class="sm muted">Scan with an authenticator app, then enter the code.</p>
        <img id="li-qr" alt="2FA QR" />
      </div>
      <label>6-digit code<input id="li-code" inputmode="numeric" maxlength="6" placeholder="000000" /></label>
    </div>
    <p id="li-error" class="err" hidden></p>
    <button class="btn primary" type="submit" id="li-submit">Sign in</button>
  </form>
</section>

<!-- ===== MAIN ===== -->
<section id="view-main" class="view" hidden>
  <header class="topbar">
    <div class="who"><span id="m-name">—</span><span id="m-ext" class="muted sm"></span></div>
    <div class="reg" id="m-reg" title="SIP registration"><span class="dot"></span><span id="m-reg-t">…</span></div>
    <button id="m-logout" class="icon-btn" title="Sign out">⎋</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="dialer">Dialer</button>
    <button class="tab" data-tab="logs">Call Logs</button>
  </nav>

  <!-- DIALER -->
  <div id="tab-dialer" class="tabpane">
    <div id="call-card" class="ios-call" hidden>
      <div class="ios-head">
        <b id="cc-name">Unknown</b>
        <span id="cc-timer" class="ios-timer">00:00</span>
        <span id="cc-sub" class="ios-sub"></span>
      </div>

      <div id="cc-incoming" class="ios-incoming" hidden>
        <button class="ios-btn decline" data-act="decline">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.81.36 1.6.7 2.34a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.74-1.74a2 2 0 0 1 2.11-.45c.74.34 1.53.57 2.34.7A2 2 0 0 1 22 16.92z" transform="rotate(135 12 12)"/></svg></span>
          <span class="lbl">decline</span>
        </button>
        <button class="ios-btn accept" data-act="answer">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.81.36 1.6.7 2.34a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.74-1.74a2 2 0 0 1 2.11-.45c.74.34 1.53.57 2.34.7A2 2 0 0 1 22 16.92z"/></svg></span>
          <span class="lbl">accept</span>
        </button>
      </div>

      <div id="cc-controls" class="ios-grid" hidden>
        <button class="ios-btn" data-act="mute">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/></svg></span>
          <span class="lbl">mute</span>
        </button>
        <button class="ios-btn" data-act="dtmf">
          <span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg></span>
          <span class="lbl">keypad</span>
        </button>
        <button class="ios-btn" data-act="hold">
          <span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></span>
          <span class="lbl">hold</span>
        </button>
        <button class="ios-btn" data-act="addpart">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg></span>
          <span class="lbl">add&nbsp;call</span>
        </button>
        <button class="ios-btn" data-act="warm">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></span>
          <span class="lbl">transfer</span>
        </button>
        <span class="ios-spacer" aria-hidden="true"></span>
      </div>

      <div id="cc-warm" class="ios-warm" hidden>
        <span class="sm">Consulting <b id="cc-warm-t"></b> — customer on hold</span>
        <div class="modal-row">
          <button class="btn ghost sm" data-act="warm-cancel">Cancel</button>
          <button class="btn primary sm" data-act="warm-complete">Complete transfer</button>
        </div>
      </div>

      <div class="ios-end">
        <button class="ios-btn hangup" data-act="hangup" title="Hang up">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.81.36 1.6.7 2.34a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.74-1.74a2 2 0 0 1 2.11-.45c.74.34 1.53.57 2.34.7A2 2 0 0 1 22 16.92z" transform="rotate(135 12 12)"/></svg>
        </button>
      </div>
    </div>

    <div id="dialer-idle">
      <div class="numrow">
        <input id="d-number" placeholder="Enter a number" autocomplete="off" inputmode="tel" pattern="[0-9+*#]*" />
        <button id="d-back" class="icon-btn" title="Delete">⌫</button>
      </div>
      <div class="keypad">
        <button>1</button><button>2</button><button>3</button>
        <button>4</button><button>5</button><button>6</button>
        <button>7</button><button>8</button><button>9</button>
        <button>*</button><button>0</button><button>#</button>
      </div>
      <button id="d-call" class="callbtn" title="Call" aria-label="Call">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.81.36 1.6.7 2.34a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.74-1.74a2 2 0 0 1 2.11-.45c.74.34 1.53.57 2.34.7A2 2 0 0 1 22 16.92z"/></svg>
      </button>
    </div>

    <div id="dtmf-pad" class="keypad small" hidden>
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button>*</button><button>0</button><button>#</button>
    </div>
  </div>

  <!-- CALL LOGS -->
  <div id="tab-logs" class="tabpane" hidden>
    <div class="filters">
      <select id="lg-range">
        <option value="today">Today</option>
        <option value="week">This week</option>
        <option value="month" selected>This month</option>
        <option value="custom">Custom…</option>
      </select>
      <div id="lg-custom" class="custom" hidden>
        <input type="date" id="lg-from" /> <span class="muted">–</span> <input type="date" id="lg-to" />
      </div>
    </div>
    <div class="subtabs">
      <button class="subtab active" data-dir="OUTBOUND">Outgoing</button>
      <button class="subtab" data-dir="INBOUND">Inbound</button>
      <button class="subtab" data-dir="MISSED">Missed</button>
      <button class="subtab" data-dir="VOICEMAIL">Voicemail</button>
    </div>
    <div id="lg-list" class="list"><p class="muted sm pad">Loading…</p></div>
    <div id="lg-more-wrap" class="pad" hidden><button id="lg-more" class="btn ghost sm">Load more</button></div>
  </div>
</section>

<div id="toast" class="toast" hidden></div>

<div id="modal" class="modal-wrap" hidden>
  <div class="modal">
    <p id="modal-msg"></p>
    <div class="modal-row">
      <button id="modal-cancel" class="btn ghost sm">Cancel</button>
      <button id="modal-ok" class="btn primary sm">Continue</button>
    </div>
  </div>
</div>

<audio id="vm-audio"></audio>
<script type="module" src="sidepanel.js"></script>
</body>
</html>
