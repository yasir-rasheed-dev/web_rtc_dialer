; Ringnex toll-free inbound campaign routing reference.
; IMPORTANT: review and merge into the custom Ringnex Asterisk only:
; /opt/ringnex-webrtc/etc/asterisk/extensions_commio.conf
; Do NOT apply this to the separate MagnusBilling/system Asterisk — same
; rule as tenant-routing-snippet.conf in this same folder.
;
; STATUS: this exact dialplan (context names, tenant checks, everything
; below) has been applied and verified live on the production box via
; `dialplan reload` + `dialplan show <context>` for all three contexts.
; The queue infrastructure section further down has also been completed
; and verified live (test queue/member round-tripped through realtime).
; This file is the accurate record of what's actually deployed, not a
; still-untested proposal.
;
; This is the inbound half tenant-routing-snippet.conf doesn't cover (that
; file is only the from-webrtc-saas / outbound-from-agent context). The
; context that actually receives calls arriving from Commio's trunk is
; [from-commio] in extensions_commio.conf (per pjsip_commio.conf's
; `context=from-commio` on the [commio] endpoint) — it is NOT a separate
; dedicated toll-free context. On the live box, [from-commio] already had
; a single-agent DID routing path (reading ringnex_inbound_did), but it was
; pre-existing dead code: the old `_X.` extension unconditionally hung up
; before the real logic (parked under an unreachable `s` extension) could
; ever run. Rather than bolt toll-free routing on next to a broken sibling
; path, both were fixed together into one [from-commio] context below:
; `_X.` now branches on whether the dialed DID is a campaign number
; (ringnex_campaign/<did> set) or a plain single-agent DID
; (ringnex_inbound_did/<did> set), with tenant ACTIVE/TRIAL gating on
; both paths.
;
; -----------------------------------------------------------------------
; Prerequisites (must exist BEFORE this dialplan will do anything useful)
; -----------------------------------------------------------------------
;
; 1. AstDB families the backend writes via AMI DBPut (see
;    backend/src/tollFreeRoutes.js) — nothing to set up, just what this
;    dialplan reads:
;      ringnex_campaign/<did>                 = <campaign-uuid>
;      ringnex_campaign_status/<campaign-id>  = ACTIVE|INACTIVE
;      ringnex_campaign_ivr/<campaign-id>     = <ivr-uuid> or empty
;      ringnex_campaign_timeout/<campaign-id> = <seconds, e.g. 300>
;      ringnex_campaign_tenant/<campaign-id>  = <tenant-uuid>
;      ringnex_ivr_greeting/<ivr-id>          = <audio filename, no extension> or empty
;      ringnex_ivr_option_<ivr-id>/<digit>    = "CAMPAIGN:<campaign-id>" or "HANGUP:"
;      ringnex_ivr_prompt_<ivr-id>/<digit>    = <audio filename, no extension> or empty
;    Plus the pre-existing single-agent families this same context now
;    relies on: ringnex_inbound_did, ringnex_tenant, ringnex_tenant_status,
;    ringnex_perm/<endpoint>/RECEIVE_CALLS.
;
; 2. Realtime `queues` and `queue_members` tables, reachable through the
;    SAME ODBC connection Asterisk already uses for ps_endpoints/ps_auths/
;    ps_aors — on the live box this is the "ringnex" connection defined in
;    res_odbc.conf ([ringnex] stanza: dsn=RingnexRealtime), which points at
;    a MariaDB instance on 127.0.0.1:3307, database ringnex_webrtc. The DSN
;    itself is defined in /etc/odbc.ini ([RingnexRealtime], Driver=MariaDB
;    Unicode) + /etc/odbcinst.ini (the driver definition) — NOT
;    res_config_mysql; this box uses res_config_odbc throughout.
;
;    extconfig.conf mapping actually used:
;
;      [settings]
;      queues => odbc,ringnex
;      queue_members => odbc,ringnex
;
;    IMPORTANT: extconfig.conf's family->backend map is only read once, at
;    Asterisk process startup (main/config.c's config_maps init) — there is
;    no live-reload command for it (`config reload extconfig` is a silent
;    no-op; the "extconfig" entry in `config list` just reflects the
;    original startup parse). Editing the file and expecting it to take
;    effect immediately will NOT work; a `core restart gracefully` (waits
;    for active calls to end, then restarts in place — same PID, since
;    Asterisk restarts via execve()) is required after changing it.
;
;    Table shape — on the live box these tables ALREADY EXISTED (created by
;    whatever originally provisioned this Asterisk install) with Asterisk's
;    full standard realtime queue schema (many more optional columns than
;    the minimal shape below — announce, wrapuptime, autopause*, etc., all
;    nullable). The columns this app actually writes are a subset and are
;    universally present in the standard schema:
;
;      queues:        name, strategy, timeout   (+ many other nullable columns)
;      queue_members: queue_name, interface, membername, penalty, paused
;                      (+ state_interface, uniqueid auto_increment, wrapuptime,
;                        ringinuse, reason_paused — all nullable/defaulted)
;
;    If provisioning a fresh box where these tables genuinely don't exist
;    yet, create them with Asterisk's documented realtime queue schema
;    (see Asterisk's contrib/realtime SQL or `core show application Queue`
;    realtime notes) rather than the trimmed version — extra nullable
;    columns are harmless and some (like announce_frequency) are useful
;    later.
;
; 3. app_queue.so must actually be loaded. This box's modules.conf has
;    `autoload=no`, so it requires an explicit `load => app_queue.so` line
;    (added after the existing `load => func_cut.so` line) — the module
;    file being present under .../modules/ is not enough by itself.
;
;    Additionally — and this was the actual blocker in practice —
;    app_queue.so's load_module() declines to load (silently, no ERROR-
;    level log line, just two informational NOTICEs about missing config)
;    if `queues.conf` and `queuerules.conf` don't exist on disk AT ALL,
;    even when queue definitions themselves come entirely from realtime.
;    A minimal static file is enough:
;
;      queues.conf:
;        [general]
;        persistentmembers = yes
;        autofill = yes
;
;      queuerules.conf:
;        [general]
;
;    After both files exist and modules.conf has the load line, `module
;    load app_queue.so` (live, no restart needed for this part) succeeds.
;    Verify with `queue show <name>` against a realtime-only queue name —
;    a working setup shows the queue with its member(s) tagged
;    "(realtime)"; `No such queue` after a successful module load usually
;    means the extconfig.conf mapping isn't live yet (see restart note
;    above), not that app_queue.so itself is broken.
;
; 4. eSpeak-NG-generated prompt audio (backend/src/tts.js writes WAV files
;    under backend/tts-audio/<hash>.wav) needs to be reachable from
;    Asterisk's sounds path — either backend and Asterisk share a
;    filesystem/mount, or a deployment step syncs backend/tts-audio/ into
;    Asterisk's custom sounds directory. Playback()/Read() below reference
;    just the filename (no extension, no path) per Asterisk convention —
;    adjust the paths if your setup nests it differently. Not yet actually
;    exercised end-to-end (no real IVR prompt has been played on a live
;    call yet) — treat the file-placement mechanics as still unverified
;    even though the dialplan logic that reads ringnex_ivr_greeting/
;    ringnex_ivr_prompt_* is live.
;
; -----------------------------------------------------------------------
; Call flow
; -----------------------------------------------------------------------
; 1. `_X.` in [from-commio] strips the dialed number to digits and checks
;    ringnex_campaign/<did> first. If set -> campaign path. Otherwise ->
;    the (now-fixed) single-agent path via ringnex_inbound_did/<did>.
; 2. Campaign path: tenant ACTIVE/TRIAL check (ringnex_campaign_tenant ->
;    ringnex_tenant_status) -> campaign ACTIVE/INACTIVE check -> IVR or
;    straight to queue.
; 3. Single-agent path: unchanged pre-existing logic (endpoint -> tenant ->
;    tenant status -> RECEIVE_CALLS permission -> Dial), just made
;    reachable again.
; 4. Active campaign with no IVR -> straight to that campaign's queue.
; 5. Active campaign with an IVR -> play the greeting, read one digit,
;    look up that digit's routing, then either queue or hang up.
; 6. Queue() rings every assigned+unpaused agent at once (ringall) for up
;    to the campaign's no_answer_timeout_sec (300s = 5 minutes, the
;    decided default). If nobody answers in time, the caller hears an
;    apology message and the call ends — no voicemail, no forwarding, per
;    the approved design.
; 7. Unknown DID / blocked tenant -> Hangup(21). Inactive campaign or
;    unassigned toll-free number -> Busy().

[from-commio]
exten => _X.,1,NoOp(Ringnex inbound Commio call to ${EXTEN})
 same => n,Set(RN_DID=${FILTER(0-9,${EXTEN})})
 same => n,Set(RN_CAMPAIGN=${DB(ringnex_campaign/${RN_DID})})
 same => n,GotoIf($["${RN_CAMPAIGN}"!=""]?campaign-route:agent-route)

 same => n(agent-route),Set(RN_ENDPOINT=${DB(ringnex_inbound_did/${RN_DID})})
 same => n,GotoIf($["${RN_ENDPOINT}"=""]?unknown-did)
 same => n,Set(RN_TENANT=${DB(ringnex_tenant/${RN_ENDPOINT})})
 same => n,GotoIf($["${RN_TENANT}"=""]?blocked)
 same => n,Set(RN_TENANT_STATUS=${DB(ringnex_tenant_status/${RN_TENANT})})
 same => n,GotoIf($["${RN_TENANT_STATUS}"="ACTIVE" | "${RN_TENANT_STATUS}"="TRIAL"]?agent-tenant-ok:blocked)
 same => n(agent-tenant-ok),Set(RN_CAN_RECEIVE=${DB(ringnex_perm/${RN_ENDPOINT}/RECEIVE_CALLS)})
 same => n,GotoIf($["${RN_CAN_RECEIVE}"="1"]?ring-agent:blocked)
 same => n(ring-agent),Dial(PJSIP/${RN_ENDPOINT},30)
 same => n,Hangup()

 same => n(campaign-route),Set(RN_CAMP_TENANT=${DB(ringnex_campaign_tenant/${RN_CAMPAIGN})})
 same => n,Set(RN_CAMP_TENANT_STATUS=${DB(ringnex_tenant_status/${RN_CAMP_TENANT})})
 same => n,GotoIf($["${RN_CAMP_TENANT_STATUS}"="ACTIVE" | "${RN_CAMP_TENANT_STATUS}"="TRIAL"]?campaign-tenant-ok:blocked)
 same => n(campaign-tenant-ok),Set(RN_CAMPAIGN_STATUS=${DB(ringnex_campaign_status/${RN_CAMPAIGN})})
 same => n,GotoIf($["${RN_CAMPAIGN_STATUS}"="ACTIVE"]?campaign-active:not-in-service)
 same => n(campaign-active),Set(RN_IVR=${DB(ringnex_campaign_ivr/${RN_CAMPAIGN})})
 same => n,GotoIf($["${RN_IVR}"!=""]?play-ivr:queue-campaign)
 same => n(queue-campaign),Goto(from-commio-tollfree-queue,${RN_CAMPAIGN},1)
 same => n(play-ivr),Goto(from-commio-tollfree-ivr,${RN_IVR},1)

 same => n(unknown-did),Hangup(1)
 same => n(not-in-service),Busy()
 same => n,Wait(3)
 same => n,Hangup(21)
 same => n(blocked),Hangup(21)

; Shared by the direct-to-queue path above and the IVR's own "route to
; campaign" action below — takes a campaign id (a UUID, not a phone number)
; in ${EXTEN}. Pattern is bare `_.` (matches one-or-more of ANY character),
; not `_X.` — X only matches a leading DIGIT, so a UUID starting with a
; letter (a-f) would silently fail to match at all. Confirmed live: this
; broke IVR routing specifically (the IVR's UUID happened to start with a
; letter) while direct-to-queue "worked" only because that campaign's UUID
; happened to start with a digit — same bug, just luck-dependent.
[from-commio-tollfree-queue]
exten => _.,1,NoOp(Queueing for campaign ${EXTEN})
 same => n,Set(RN_CID=${EXTEN})
 same => n,Set(RN_TIMEOUT=${DB(ringnex_campaign_timeout/${RN_CID})})
 same => n,GotoIf($["${RN_TIMEOUT}"=""]?default-timeout:has-timeout)
 same => n(default-timeout),Set(RN_TIMEOUT=300)
 same => n(has-timeout),Queue(ringnex-campaign-${RN_CID},t,,,${RN_TIMEOUT})
 ; Queue() only returns here if nobody answered within RN_TIMEOUT, the
 ; queue had no members, or a similar non-connect outcome — a caller who
 ; got bridged to an agent never reaches this line.
 same => n,Playback(im-sorry)
 same => n,Hangup()

; Dynamic, data-driven IVR — digits/options come from ivr_options via the
; ringnex_ivr_option_<id> AstDB family, not static dialplan extensions, so
; this uses Read() (one digit into a variable) rather than the usual
; Background()+WaitExten()+per-digit-exten pattern, which would require a
; static extension per possible digit. Takes an ivr id (a UUID) in ${EXTEN}
; — same bare `_.` pattern reasoning as [from-commio-tollfree-queue] above.
[from-commio-tollfree-ivr]
exten => _.,1,NoOp(Playing IVR ${EXTEN})
 same => n,Set(RN_IVR_ID=${EXTEN})
 same => n,Set(RN_GREETING=${DB(ringnex_ivr_greeting/${RN_IVR_ID})})
 ; Read(variable, filename, max-digits, options, attempts, timeout) — plays
 ; `filename` (blank plays nothing, just waits) and reads up to 1 digit,
 ; 2 attempts, 7s timeout per attempt.
 same => n,Read(RN_DIGIT,${RN_GREETING},1,,2,7)
 same => n,GotoIf($["${RN_DIGIT}"=""]?no-input)

 same => n,Set(RN_OPTION=${DB(ringnex_ivr_option_${RN_IVR_ID}/${RN_DIGIT})})
 same => n,GotoIf($["${RN_OPTION}"=""]?invalid-digit)
 same => n,Set(RN_ACTION=${CUT(RN_OPTION,:,1)})
 same => n,Set(RN_TARGET=${CUT(RN_OPTION,:,2)})
 same => n,GotoIf($["${RN_ACTION}"="HANGUP"]?say-goodbye:route-to-campaign)

 same => n(route-to-campaign),Goto(from-commio-tollfree-queue,${RN_TARGET},1)

 same => n(say-goodbye),Playback(vm-goodbye)
 same => n,Hangup()

 same => n(invalid-digit),Playback(pbx-invalid)
 same => n,Hangup(1)

 same => n(no-input),Playback(pbx-invalid)
 same => n,Hangup(1)
